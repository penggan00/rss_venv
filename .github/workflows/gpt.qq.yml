name: rss Alpine rss_venv

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: alpine:3.23

    steps:
    - name: Install system dependencies
      run: |
        apk add --no-cache python3 python3-dev py3-pip gcc musl-dev linux-headers rust cargo curl
    
    - name: Create venv and install packages
      run: |
        python3 -m venv --copies rss_venv
        source rss_venv/bin/activate
        pip install --upgrade pip
        pip install \
          psutil==7.1.3 \
          python-dotenv==1.2.1 \
          "python-telegram-bot[job-queue]==22.5" \
          aiosqlite==0.22.0 \
          aiohttp==3.11.16 \
          Pillow==12.0.0 \
          google-genai==2.22.0 \
          md2tgmd==0.3.10 \
          requests==2.32.5 \
          pytz==2025.2 \
          lunarcalendar==0.0.9 \
          feedparser==6.0.11 \
          tenacity==9.0.0 \
          langdetect==1.0.9 \
          beautifulsoup4==4.13.4 \
          html5lib==1.1 \
          pdfplumber==0.11.7 \
          --break-system-packages
    
    - name: Clean up unused files
      run: |
        rm -rf rss_venv/lib/python3.*/site-packages/pip
        rm -rf rss_venv/lib/python3.*/site-packages/setuptools
        find rss_venv -type d -name "__pycache__" -exec rm -rf {} +
    
    - name: Debug size
      run: |
        echo "=== venv size ==="
        du -sh rss_venv
        echo "=== file count ==="
        find rss_venv | wc -l
    
    - name: Package
      run: tar -czf rss_venv.tar.gz rss_venv

    - name: Publish to Release
      run: |
        TAG="venv-$(date +%Y%m%d-%H%M%S)"
        echo "TAG=$TAG" >> $GITHUB_ENV
        # 用 GITHUB_TOKEN 打 tag 并创建 release（Alpine 里没有 gh，直接用 curl 调 API）
        curl -sSL -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/releases \
          -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}"
        # 上传 asset
        UPLOAD_URL="https://uploads.github.com/repos/${{ github.repository }}/releases/tags/$TAG/assets?name=rss_venv.tar.gz"
        curl -sSL -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/gzip" \
          --data-binary @rss_venv.tar.gz \
          "$UPLOAD_URL"
